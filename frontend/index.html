<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Summer 2026 Internship Tracker</h1>
            <div class="header-actions">
                <button id="refreshBtn" class="btn btn-primary">🔄 Refresh Data</button>
                <div class="upload-section">
                    <label for="resumeUpload" class="btn btn-secondary">📄 Upload Resume</label>
                    <input type="file" id="resumeUpload" accept=".pdf,.doc,.docx" style="display: none;">
                </div>
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat">
                <span class="stat-label">Total:</span>
                <span id="totalCount" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Applied:</span>
                <span id="appliedCount" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">FAANG+:</span>
                <span id="faangCount" class="stat-value">0</span>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="categoryFilter">Categories:</label>
                <div class="multi-select-container">
                    <div class="multi-select-header" id="categoryFilterHeader">
                        <span class="multi-select-text">All Categories</span>
                        <span class="multi-select-arrow">▼</span>
                    </div>
                    <div class="multi-select-dropdown" id="categoryFilterDropdown">
                        <label><input type="checkbox" value="software_engineering"> Software Engineering</label>
                        <label><input type="checkbox" value="data_science"> Data Science & ML</label>
                        <label><input type="checkbox" value="quant_finance"> Quantitative Finance</label>
                        <label><input type="checkbox" value="product_management"> Product Management</label>
                        <label><input type="checkbox" value="hardware_engineering"> Hardware Engineering</label>
                    </div>
                </div>
            </div>

            <div class="filter-group">
                <label for="locationFilter">Locations:</label>
                <div class="multi-select-container">
                    <div class="multi-select-header" id="locationFilterHeader">
                        <span class="multi-select-text">All Locations</span>
                        <span class="multi-select-arrow">▼</span>
                    </div>
                    <div class="multi-select-dropdown" id="locationFilterDropdown">
                        <input type="text" class="dropdown-search" id="locationSearch" placeholder="Search locations..." />
                        <div class="dropdown-options" style="max-height: 250px; overflow-y: auto;">
                        </div>
                    </div>
                </div>
            </div>

            <div class="filter-group">
                <label for="companyFilter">Companies:</label>
                <div class="multi-select-container">
                    <div class="multi-select-header" id="companyFilterHeader">
                        <span class="multi-select-text">All Companies</span>
                        <span class="multi-select-arrow">▼</span>
                    </div>
                    <div class="multi-select-dropdown" id="companyFilterDropdown">
                        <input type="text" class="dropdown-search" id="companySearch" placeholder="Search companies..." />
                        <div class="dropdown-options" style="max-height: 250px; overflow-y: auto;">
                        </div>
                    </div>
                </div>
            </div>

            <div class="filter-group">
                <label for="dateFromFilter">Date From:</label>
                <input type="date" id="dateFromFilter">
            </div>

             <div class="filter-group">
                 <label for="dateToFilter">Date To:</label>
                 <input type="date" id="dateToFilter">
             </div>

             <div style="flex-basis: 100%;"></div>

             <div class="filter-group">
                 <label>FAANG+ Filter:</label>
                 <div class="radio-group">
                     <label class="radio-btn">
                         <input type="radio" name="faangFilter" value="all" checked>
                         <span>All</span>
                     </label>
                     <label class="radio-btn">
                         <input type="radio" name="faangFilter" value="only">
                         <span>Only FAANG+</span>
                     </label>
                     <label class="radio-btn">
                         <input type="radio" name="faangFilter" value="exclude">
                         <span>Exclude FAANG+</span>
                     </label>
                 </div>
             </div>

             <div class="filter-group">
                 <label>PhD/Graduates Filter:</label>
                 <div class="radio-group">
                     <label class="radio-btn">
                         <input type="radio" name="phdFilter" value="all" checked>
                         <span>All</span>
                     </label>
                     <label class="radio-btn">
                         <input type="radio" name="phdFilter" value="only">
                         <span>Only PhD/Grad</span>
                     </label>
                     <label class="radio-btn">
                         <input type="radio" name="phdFilter" value="exclude">
                         <span>Exclude PhD/Grad</span>
                     </label>
                 </div>
             </div>

             <div class="filter-group">
                 <label>Clearance Filter:</label>
                 <div class="radio-group">
                     <label class="radio-btn">
                         <input type="radio" name="clearanceFilter" value="all" checked>
                         <span>All</span>
                     </label>
                     <label class="radio-btn">
                         <input type="radio" name="clearanceFilter" value="only">
                         <span>Only Clearance</span>
                     </label>
                     <label class="radio-btn">
                         <input type="radio" name="clearanceFilter" value="exclude">
                         <span>Exclude Clearance</span>
                     </label>
                 </div>
             </div>

             <div class="filter-group">
                 <label>Status Filter:</label>
                 <div class="radio-group">
                     <label class="radio-btn">
                         <input type="radio" name="statusFilter" value="all" checked>
                         <span>All</span>
                     </label>
                     <label class="radio-btn">
                         <input type="radio" name="statusFilter" value="active">
                         <span>Active Only</span>
                     </label>
                     <label class="radio-btn">
                         <input type="radio" name="statusFilter" value="inactive">
                         <span>Inactive Only</span>
                     </label>
                 </div>
             </div>

             <div class="filter-group">
                 <label>
                     <input type="checkbox" id="showAppliedFilter">
                     Show Applied Only
                 </label>
             </div>

            <button id="resetFilters" class="btn btn-secondary">Reset Filters</button>
        </div>

        <div class="table-container">
            <table id="internshipsTable">
                <thead>
                    <tr>
                         <th>Applied</th>
                         <th>Company</th>
                         <th>Role</th>
                         <th>Location</th>
                         <th>Category</th>
                         <th>Emojis</th>
                         <th>Date Posted</th>
                         <th>Season</th>
                         <th>Links</th>
                         <th>Resume</th>
                         <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="internshipsBody">
                     <tr>
                         <td colspan="11" class="loading">Loading internships...</td>
                     </tr>
                </tbody>
            </table>
        </div>

        <div id="resumeModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Select Resume</h2>
                <div id="resumeList"></div>
            </div>
        </div>
    </div>

    <script src="app.js?v=6"></script>
</body>
</html>
